[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ntp-sync-lab"
version = "0.1.0"
description = "Educational NTP exchange calculations and clock synchronization lab"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.6,<3", "anyio>=4.1,<5"]
web-test = ["httpx>=0.27,<1"]

[project.scripts]
ntp-sync-lab = "ntp_sync_lab.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ntp_sync_lab = ["fixtures/scenarios/*.json", "fixtures/recordings/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
